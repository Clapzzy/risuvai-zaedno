<!doctype html>
<html lang="bg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Рисувай Заедно</title>
<script src="https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
  :root { --bg:#f4f1ea; --panel:#fff; --ink:#222; --muted:#777; --accent:#ff5a36; --line:#e2ddd3; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--ink); font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
  button { font:inherit; cursor:pointer; border:0; border-radius:10px; padding:10px 14px; background:var(--ink); color:#fff; }
  button.secondary { background:#fff; color:var(--ink); border:1px solid var(--line); }
  input { font:inherit; padding:10px 12px; border:1px solid var(--line); border-radius:10px; width:100%; background:#fff; }
  .hidden { display:none !important; }

  /* Lobby */
  #lobby { min-height:100%; display:flex; align-items:center; justify-content:center; padding:16px; }
  .card { background:var(--panel); border-radius:18px; padding:28px; width:100%; max-width:400px; box-shadow:0 10px 40px rgba(0,0,0,.08); }
  .card h1 { margin:0 0 4px; font-size:28px; }
  .card p { margin:0 0 20px; color:var(--muted); }
  .card label { display:block; font-size:13px; color:var(--muted); margin:14px 0 6px; }
  .row { display:flex; gap:8px; }
  .row input { flex:1; text-transform:uppercase; letter-spacing:2px; }
  #createBtn { width:100%; margin-top:18px; background:var(--accent); padding:14px; font-weight:600; }
  .or { text-align:center; color:var(--muted); margin:16px 0 0; font-size:13px; }
  #lobbyMsg { color:#c62828; margin-top:12px; min-height:20px; font-size:14px; }

  /* App */
  #app { height:100%; display:grid; grid-template-columns: 1fr 280px; grid-template-rows: auto 1fr; }
  header { grid-column:1/-1; display:flex; align-items:center; gap:12px; padding:8px 12px; background:#fff; border-bottom:1px solid var(--line); flex-wrap:wrap; }
  header .room { font-weight:700; letter-spacing:2px; }
  header .status { font-size:13px; color:var(--muted); }
  header .dot { width:9px; height:9px; border-radius:50%; background:#bbb; display:inline-block; margin-right:4px; }
  header .dot.on { background:#2e7d32; }
  .tools { display:flex; align-items:center; gap:6px; margin-left:auto; flex-wrap:wrap; }
  .swatch { width:26px; height:26px; border-radius:50%; border:3px solid #fff; box-shadow:0 0 0 1px var(--line); padding:0; }
  .swatch.active { box-shadow:0 0 0 2px var(--ink); }
  .tools input[type=range] { width:80px; padding:0; }
  .tools button { padding:6px 10px; font-size:14px; }
  .tools button.active { background:var(--accent); color:#fff; border-color:var(--accent); }

  #stage { position:relative; padding:12px; display:flex; align-items:center; justify-content:center; overflow:hidden; min-height:0; }
  #boardWrap { position:relative; width:100%; max-height:100%; aspect-ratio: 16/10; max-width: calc((100vh - 90px) * 1.6); }
  canvas { width:100%; height:100%; background:#fff; border-radius:12px; box-shadow:0 4px 20px rgba(0,0,0,.07); touch-action:none; display:block; cursor:crosshair; }
  .cursor { position:absolute; pointer-events:none; transform:translate(-2px,-2px); font-size:11px; white-space:nowrap; transition: left .05s linear, top .05s linear; }
  .cursor i { display:block; width:10px; height:10px; border-radius:50%; border:2px solid #fff; }
  .cursor span { color:#fff; padding:1px 6px; border-radius:6px; margin:2px 0 0 8px; display:inline-block; }

  aside { background:#fff; border-left:1px solid var(--line); display:flex; flex-direction:column; min-height:0; }
  aside section { padding:12px; border-bottom:1px solid var(--line); }
  aside h3 { margin:0 0 8px; font-size:13px; text-transform:uppercase; color:var(--muted); letter-spacing:.5px; }
  #players { list-style:none; margin:0; padding:0; }
  #players li { display:flex; align-items:center; gap:8px; padding:3px 0; }
  #players li i { width:12px; height:12px; border-radius:50%; }
  #qr { display:flex; gap:10px; align-items:center; font-size:12px; color:var(--muted); }
  #qr img { width:96px; height:96px; image-rendering:pixelated; }
  #chat { flex:1; display:flex; flex-direction:column; min-height:160px; padding:12px; }
  #messages { flex:1; overflow-y:auto; font-size:14px; display:flex; flex-direction:column; gap:4px; margin-bottom:8px; }
  #messages .sys { color:var(--muted); font-style:italic; font-size:12px; }
  #chatForm { display:flex; gap:6px; }
  #chatForm button { padding:8px 12px; }

  #toast { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--ink); color:#fff; padding:10px 16px; border-radius:10px; opacity:0; transition:opacity .3s; pointer-events:none; z-index:10; }
  #toast.show { opacity:1; }

  @media (max-width: 800px) {
    #app { grid-template-columns: 1fr; grid-template-rows: auto auto 1fr; height:auto; min-height:100%; }
    #stage { padding:8px; }
    #boardWrap { max-width:none; }
    aside { border-left:0; border-top:1px solid var(--line); }
    #chat { min-height:220px; }
    .tools { margin-left:0; width:100%; }
  }
</style>
</head>
<body>

<div id="lobby">
  <div class="card">
    <h1>🎨 Рисувай Заедно</h1>
    <p>Рисувайте на едно платно от няколко устройства в реално време.</p>
    <label for="nameInput">Твоето име</label>
    <input id="nameInput" maxlength="16" placeholder="напр. Мартин">
    <button id="createBtn">Създай нова стая</button>
    <div class="or">— или влез в съществуваща —</div>
    <label for="codeInput">Код на стая</label>
    <div class="row">
      <input id="codeInput" maxlength="5" placeholder="ABCDE">
      <button id="joinBtn">Влез</button>
    </div>
    <div id="lobbyMsg"></div>
  </div>
</div>

<div id="app" class="hidden">
  <header>
    <div>Стая <span class="room" id="roomCode"></span></div>
    <button class="secondary" id="copyBtn" style="padding:6px 10px;font-size:13px">Копирай линк</button>
    <div class="status"><span class="dot" id="dot"></span><span id="statusText">свързване…</span></div>
    <div class="tools" id="tools"></div>
  </header>
  <div id="stage">
    <div id="boardWrap">
      <canvas id="board" width="1600" height="1000"></canvas>
    </div>
  </div>
  <aside>
    <section>
      <h3>Играчи (<span id="playerCount">0</span>)</h3>
      <ul id="players"></ul>
    </section>
    <section>
      <div id="qr"></div>
    </section>
    <div id="chat">
      <h3>Чат</h3>
      <div id="messages"></div>
      <form id="chatForm">
        <input id="chatInput" maxlength="200" placeholder="Напиши съобщение…" autocomplete="off">
        <button>➤</button>
      </form>
    </div>
  </aside>
</div>
<div id="toast"></div>

<script>
/* =====================================================================
   Рисувай Заедно — real-time collaborative drawing between devices.
   Transport: WebSockets (MQTT over wss://) to two free public brokers.
   Every message is published to ALL brokers and de-duplicated on
   receipt, so the room keeps working even if one server is down.
   WebSockets go over normal HTTPS, so they work on any Wi-Fi / mobile
   network (no NAT / TURN problems like WebRTC).
   ===================================================================== */
const BROKERS = [
  { url: 'wss://public.cloud.shiftr.io', username: 'public', password: 'public' }, // port 443: passes strict school firewalls
  { url: 'wss://test.mosquitto.org:8081' },
  { url: 'wss://broker.hivemq.com:8884/mqtt' },
];
const PREFIX = 'risuvai-zaedno-v2/';
const COLORS = ['#222222','#e53935','#fb8c00','#fdd835','#43a047','#1e88e5','#8e24aa','#ff80ab','#795548'];
const PLAYER_COLORS = ['#e53935','#1e88e5','#43a047','#fb8c00','#8e24aa','#00897b','#d81b60','#6d4c41','#3949ab','#c0ca33'];
const PING_MS = 2000, TIMEOUT_MS = 8000;
const $ = id => document.getElementById(id);

const myId = Math.random().toString(36).slice(2, 10);
let roomCode = '', myName = '', myColor = '#999', myJoinedAt = 0;
let clients = [];                 // MQTT connections (one per broker)
let inRoom = false;               // entered the drawing screen
let wantState = false, stateBuf = null, pendingSegs = [];
let seq = 0;
let epoch = 0;                    // bumps on every "clear"; segments from before a clear are ignored
let prevId = null;                // my id before a page refresh (so others drop the old copy of me)
const players = new Map();        // id -> {name, color, joinedAt, lastSeen}
let strokes = [];                 // full drawing history (everyone keeps a copy)
let brush = { color: COLORS[0], size: 6, eraser: false };

/* ---------- Lobby ---------- */
const params = new URLSearchParams(location.search);
if (params.get('room')) $('codeInput').value = params.get('room').toUpperCase();
$('nameInput').value = storageGet('name') || '';
$('createBtn').onclick = () => start(true);
$('joinBtn').onclick = () => start(false);
$('codeInput').addEventListener('keydown', e => { if (e.key === 'Enter') start(false); });

function storageGet(k) { try { return localStorage.getItem(k); } catch { return null; } }
function storageSet(k, v) { try { localStorage.setItem(k, v); } catch {} }

function randomCode() {
  const a = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  return Array.from({ length: 5 }, () => a[Math.floor(Math.random() * a.length)]).join('');
}

function lobbyStatus(msg, isError) {
  $('lobbyMsg').style.color = isError ? '#c62828' : '#777';
  $('lobbyMsg').textContent = msg;
}

function lobbyError(msg) {
  lobbyStatus(msg, true);
  $('createBtn').disabled = $('joinBtn').disabled = false;
  disconnectAll();
}

async function start(create) {
  try { prevId = sessionStorage.getItem('rz-id'); sessionStorage.setItem('rz-id', myId); } catch {}
  myName = $('nameInput').value.trim() || 'Гост' + Math.floor(Math.random() * 100);
  storageSet('name', myName);
  roomCode = create ? randomCode() : $('codeInput').value.trim().toUpperCase();
  if (!create && roomCode.length !== 5) { lobbyStatus('Въведи 5-символен код на стая.', true); return; }
  $('createBtn').disabled = $('joinBtn').disabled = true;
  lobbyStatus('Свързване със сървъра…');

  try { await connectAll(); }
  catch { lobbyError('Няма връзка със сървъра. Провери интернета и опитай пак.'); return; }

  if (create) {
    myColor = PLAYER_COLORS[0];
    myJoinedAt = Date.now();
    players.set(myId, { name: myName, color: myColor, joinedAt: myJoinedAt, lastSeen: Date.now() });
    enterApp();
    sysMsg('Стаята е създадена. Покани други с кода ' + roomCode + ' или QR кода.');
    sendPing();
  } else {
    lobbyStatus('Влизане в стая ' + roomCode + '…');
    requestState();
    let tries = 0;
    const retry = setInterval(() => {
      if (inRoom) return clearInterval(retry);
      if (++tries >= 4) { clearInterval(retry); lobbyError('Няма активна стая с код ' + roomCode + '. Провери кода (стаята е активна, докато някой е вътре).'); return; }
      requestState(); // resend in case the first message was lost
    }, 3000);
  }
}

/* ---------- Networking (MQTT over WebSockets) ---------- */
function topicAll() { return PREFIX + roomCode + '/all'; }
function topicMe() { return PREFIX + roomCode + '/to/' + myId; }

function connectAll() {
  return new Promise((resolve, reject) => {
    let settled = false, failed = 0;
    clients = BROKERS.map(({ url, username, password }) => {
      const c = mqtt.connect(url, {
        username, password,
        clientId: 'rz_' + myId + '_' + Math.random().toString(36).slice(2, 6),
        connectTimeout: 10000, reconnectPeriod: 2000, keepalive: 10, clean: true,
      });
      let everConnected = false;
      c.on('connect', () => {
        c.subscribe([topicAll(), topicMe()]);
        if (!settled) { settled = true; resolve(); }
        else if (everConnected && inRoom) requestState(true); // came back after a drop: resync the drawing
        everConnected = true;
        updateStatus();
      });
      c.on('message', (topic, payload) => { try { onMessage(JSON.parse(payload.toString())); } catch (e) { console.warn(e); } });
      c.on('close', updateStatus);
      c.on('offline', updateStatus);
      c.on('error', e => console.warn(url, e.message));
      return c;
    });
    setTimeout(() => { if (!settled) { settled = true; reject(new Error('timeout')); } }, 15000);
  });
}

function disconnectAll() { clients.forEach(c => c.end(true)); clients = []; }

function publish(topic, msg) {
  msg.f = myId; msg.q = ++seq;
  const data = JSON.stringify(msg);
  clients.forEach(c => { if (c.connected) c.publish(topic, data); });
}
const send = msg => publish(topicAll(), msg);
const sendTo = (id, msg) => publish(PREFIX + roomCode + '/to/' + id, msg);

// de-duplicate: each message arrives once per broker
const seen = new Map();
function isDuplicate(m) {
  let s = seen.get(m.f);
  if (!s) seen.set(m.f, s = new Set());
  if (s.has(m.q)) return true;
  s.add(m.q);
  if (s.size > 2000) s.delete(s.values().next().value);
  return false;
}

function updateStatus() {
  const n = clients.filter(c => c.connected).length;
  if (!inRoom) return;
  const ok = n > 0 && navigator.onLine !== false;
  $('dot').classList.toggle('on', ok);
  $('statusText').textContent = ok ? 'свързан (' + n + '/' + clients.length + ' сървъра)' : 'няма връзка, опитвам отново…';
}

function requestState(resync) {
  wantState = true; stateBuf = null;
  send({ t: 'hello', name: myName, color: myColor, joinedAt: myJoinedAt, resync: !!resync, rp: prevId });
  if (resync) setTimeout(() => { if (wantState && inRoom) { wantState = false; flushPending(); } }, 5000); // nobody answered (e.g. I'm alone)
}

function sendPing() { send({ t: 'ping', name: myName, color: myColor, joinedAt: myJoinedAt, rp: prevId }); }

// two people picked the same colour (joined at the same moment): the later one switches
function fixColourClash(m) {
  if (m.color !== myColor || !players.has(m.f)) return;
  const other = players.get(m.f);
  if (!(other.joinedAt < myJoinedAt || (other.joinedAt === myJoinedAt && m.f < myId))) return;
  const used = new Set([...players].filter(([id]) => id !== myId).map(([, p]) => p.color));
  myColor = PLAYER_COLORS.find(c => !used.has(c)) || PLAYER_COLORS[Math.floor(Math.random() * PLAYER_COLORS.length)];
  players.get(myId).color = myColor;
  renderPlayers(); sendPing();
}

// a segment / clear from a newer "epoch" means someone cleared the board
function syncEpoch(ep) {
  if ((ep || 0) <= epoch) return false;
  epoch = ep; strokes = []; outbox = []; clearBoard();
  return true;
}
function applySegs(m) {
  if ((m.ep || 0) < epoch) return; // drawn before a clear we already applied
  syncEpoch(m.ep);
  m.s.forEach(s => { strokes.push(s); drawSeg(s); });
}
function flushPending() { const p = pendingSegs; pendingSegs = []; p.forEach(applySegs); }

function upsertPlayer(m) {
  const isNew = !players.has(m.f);
  const p = players.get(m.f) || {};
  Object.assign(p, { name: String(m.name || '?').slice(0, 16), color: m.color || '#999', joinedAt: m.joinedAt || 0, lastSeen: Date.now() });
  players.set(m.f, p);
  if (isNew) renderPlayers();
  return isNew;
}

// the longest-present member answers newcomers with the drawing history
function iAmResponder(exceptId) {
  let best = null;
  for (const [id, p] of players) {
    if (id === exceptId || !p.joinedAt) continue;
    if (id !== myId && Date.now() - p.lastSeen > 5000) continue; // probably gone
    if (!best || p.joinedAt < best.p.joinedAt || (p.joinedAt === best.p.joinedAt && id < best.id)) best = { id, p };
  }
  return best && best.id === myId;
}

function sendState(to) {
  const CHUNK = 400, total = Math.max(1, Math.ceil(strokes.length / CHUNK));
  const list = [...players].map(([id, p]) => [id, { name: p.name, color: p.color, joinedAt: p.joinedAt }]);
  for (let i = 0; i < total; i++)
    sendTo(to, { t: 'state', ep: epoch, part: i, total, segs: strokes.slice(i * CHUNK, (i + 1) * CHUNK), players: i === 0 ? list : undefined });
}

function onMessage(m) {
  if (!m || m.f === myId || isDuplicate(m)) return;
  if (m.rp && m.rp !== m.f && m.rp !== myId && players.has(m.rp)) { // that device refreshed: forget its old copy
    players.delete(m.rp); removeCursor(m.rp); renderPlayers();
  }
  const p = players.get(m.f);
  if (p) p.lastSeen = Date.now();

  switch (m.t) {
    case 'hello': {
      if (!inRoom) return;
      if (m.joinedAt) upsertPlayer(m); // a returning member re-syncing
      if (iAmResponder(m.f)) sendState(m.f);
      break;
    }
    case 'ping': {
      if (!inRoom) return;
      if (upsertPlayer(m)) sysMsg(players.get(m.f).name + ' влезе');
      else renderPlayers();
      fixColourClash(m);
      break;
    }
    case 'bye': removePlayer(m.f); break;
    case 'state': onState(m); break;
    case 'segs':
      if (!inRoom || wantState) { pendingSegs.push(m); return; }
      applySegs(m);
      break;
    case 'clear':
      if (!inRoom || wantState) { pendingSegs.push({ s: [], ep: m.ep }); return; }
      if ((m.ep || 0) < epoch) return;
      syncEpoch(m.ep);
      sysMsg((p ? p.name : 'Някой') + ' изчисти платното');
      break;
    case 'chat':
      if (!p) return;
      chatMsg({ name: p.name, color: p.color, text: String(m.text).slice(0, 200) });
      break;
    case 'cur': if (p) showCursor(m.f, m.x, m.y); break;
  }
}

function onState(m) {
  if (!wantState) return;
  if (!stateBuf || stateBuf.total !== m.total) stateBuf = { total: m.total, parts: [], from: m.f };
  if (m.f !== stateBuf.from) return; // only use one responder's copy
  stateBuf.parts[m.part] = m;
  if (stateBuf.parts.filter(Boolean).length < m.total) return;

  const parts = stateBuf.parts; wantState = false; stateBuf = null;
  const first = parts[0];
  const firstJoin = !inRoom;
  if (first.players) for (const [id, info] of first.players) if (id !== myId) players.set(id, { ...info, lastSeen: Date.now() });

  if (firstJoin) {
    const used = new Set([...players.values()].map(x => x.color));
    myColor = PLAYER_COLORS.find(c => !used.has(c)) || PLAYER_COLORS[players.size % PLAYER_COLORS.length];
    myJoinedAt = Date.now();
    players.set(myId, { name: myName, color: myColor, joinedAt: myJoinedAt, lastSeen: Date.now() });
    enterApp();
    sysMsg('Влезе в стая ' + roomCode);
  }
  epoch = first.ep || 0;
  strokes = parts.flatMap(x => x.segs);
  clearBoard(); strokes.forEach(drawSeg);
  flushPending();
  renderPlayers();
  sendPing(); // announce myself (with my colour) to everyone
}

function removePlayer(id) {
  const p = players.get(id);
  if (!p || id === myId) return;
  players.delete(id); removeCursor(id); renderPlayers();
  sysMsg(p.name + ' излезе');
}

/* heartbeat: tell others we're here, drop players we haven't heard from */
setInterval(() => {
  if (!inRoom) return;
  sendPing();
  const me = players.get(myId); if (me) me.lastSeen = Date.now();
  for (const [id, p] of players) if (id !== myId && Date.now() - p.lastSeen > TIMEOUT_MS) removePlayer(id);
}, PING_MS);

/* ---------- App UI ---------- */
function enterApp() {
  inRoom = true;
  $('lobby').classList.add('hidden');
  $('app').classList.remove('hidden');
  $('roomCode').textContent = roomCode;
  history.replaceState(null, '', '?room=' + roomCode);
  buildTools(); renderPlayers(); renderQR(); updateStatus();
}

function joinLink() { return location.origin + location.pathname + '?room=' + roomCode; }

function renderQR() {
  try {
    const qr = qrcode(0, 'M');
    qr.addData(joinLink()); qr.make();
    $('qr').innerHTML = qr.createImgTag(4, 0) + '<div>Сканирай с телефон, за да влезеш в стаята.</div>';
  } catch (e) { $('qr').textContent = joinLink(); }
}

$('copyBtn').onclick = async () => {
  try { await navigator.clipboard.writeText(joinLink()); toast('Линкът е копиран'); }
  catch { prompt('Копирай линка:', joinLink()); }
};

function renderPlayers() {
  const list = [...players].sort((a, b) => a[1].joinedAt - b[1].joinedAt);
  $('playerCount').textContent = list.length;
  $('players').innerHTML = '';
  list.forEach(([id, p], i) => {
    const li = document.createElement('li');
    li.innerHTML = '<i></i><span></span>';
    li.querySelector('i').style.background = p.color;
    li.querySelector('span').textContent = p.name + (id === myId ? ' (ти)' : '') + (i === 0 ? ' 👑' : '');
    $('players').appendChild(li);
  });
}

function buildTools() {
  const t = $('tools'); t.innerHTML = '';
  COLORS.forEach((c, i) => {
    const b = document.createElement('button');
    b.className = 'swatch' + (i === 0 ? ' active' : '');
    b.style.background = c; b.title = c;
    b.onclick = () => { brush.color = c; brush.eraser = false; updateToolUI(b); };
    t.appendChild(b);
  });
  const size = document.createElement('input');
  size.type = 'range'; size.min = 2; size.max = 40; size.value = brush.size; size.title = 'Дебелина';
  size.oninput = () => brush.size = +size.value;
  t.appendChild(size);
  const er = document.createElement('button'); er.textContent = 'Гума'; er.id = 'eraserBtn'; er.className = 'secondary';
  er.onclick = () => { brush.eraser = !brush.eraser; updateToolUI(); };
  t.appendChild(er);
  const cl = document.createElement('button'); cl.textContent = 'Изчисти'; cl.className = 'secondary';
  cl.onclick = () => { if (!confirm('Да изчистя ли платното за всички?')) return; epoch++; strokes = []; outbox = []; clearBoard(); send({ t: 'clear', ep: epoch }); };
  t.appendChild(cl);
  const sv = document.createElement('button'); sv.textContent = 'Запази'; sv.className = 'secondary';
  sv.onclick = () => { const a = document.createElement('a'); a.download = 'risunka-' + roomCode + '.png'; a.href = board.toDataURL(); a.click(); };
  t.appendChild(sv);
}

function updateToolUI(activeSwatch) {
  if (activeSwatch) document.querySelectorAll('.swatch').forEach(s => s.classList.toggle('active', s === activeSwatch));
  $('eraserBtn').classList.toggle('active', brush.eraser);
}

/* ---------- Drawing ---------- */
// a segment is a compact array: [x0, y0, x1, y1, color, width, eraser]
const board = $('board');
const ctx = board.getContext('2d');
ctx.lineCap = 'round'; ctx.lineJoin = 'round';
let last = null, outbox = [], lastCursorSent = 0;

function clearBoard() { ctx.clearRect(0, 0, board.width, board.height); }

function drawSeg(s) {
  ctx.globalCompositeOperation = s[6] ? 'destination-out' : 'source-over';
  ctx.strokeStyle = s[4]; ctx.lineWidth = s[5];
  ctx.beginPath(); ctx.moveTo(s[0], s[1]); ctx.lineTo(s[2], s[3]); ctx.stroke();
  ctx.globalCompositeOperation = 'source-over';
}

function pos(e) {
  const r = board.getBoundingClientRect();
  return { x: Math.round((e.clientX - r.left) * board.width / r.width), y: Math.round((e.clientY - r.top) * board.height / r.height) };
}

board.addEventListener('pointerdown', e => {
  board.setPointerCapture(e.pointerId);
  last = pos(e);
  addSeg(last, { x: last.x + 0.1, y: last.y }); // a dot on tap
});
board.addEventListener('pointermove', e => {
  const p = pos(e);
  const now = performance.now();
  if (now - lastCursorSent > 100) { lastCursorSent = now; send({ t: 'cur', x: +(p.x / board.width).toFixed(3), y: +(p.y / board.height).toFixed(3) }); }
  if (!last) return;
  addSeg(last, p);
  last = p;
});
['pointerup', 'pointercancel', 'pointerleave'].forEach(ev => board.addEventListener(ev, () => last = null));

function addSeg(a, b) {
  const s = [a.x, a.y, b.x, b.y, brush.color, brush.eraser ? brush.size * 3 : brush.size, brush.eraser ? 1 : 0];
  drawSeg(s); strokes.push(s); outbox.push(s);
}
// batch segments: at most ~25 messages per second while drawing
setInterval(() => { if (outbox.length) { send({ t: 'segs', s: outbox, ep: epoch }); outbox = []; } }, 40);

/* ---------- Cursors ---------- */
const cursors = new Map();
function showCursor(id, x, y) {
  const p = players.get(id); if (!p) return;
  let el = cursors.get(id);
  if (!el) {
    el = document.createElement('div'); el.className = 'cursor';
    el.innerHTML = '<i></i><span></span>';
    $('boardWrap').appendChild(el); cursors.set(id, el);
  }
  el.querySelector('i').style.background = p.color;
  const sp = el.querySelector('span'); sp.style.background = p.color; sp.textContent = p.name;
  el.style.left = (x * 100) + '%'; el.style.top = (y * 100) + '%';
  clearTimeout(el._t); el.style.opacity = 1;
  el._t = setTimeout(() => el.style.opacity = 0, 3000);
}
function removeCursor(id) { const el = cursors.get(id); if (el) { el.remove(); cursors.delete(id); } }

/* ---------- Chat ---------- */
$('chatForm').addEventListener('submit', e => {
  e.preventDefault();
  const text = $('chatInput').value.trim();
  if (!text) return;
  $('chatInput').value = '';
  chatMsg({ name: myName, color: myColor, text });
  send({ t: 'chat', text });
});

function chatMsg(m) {
  const d = document.createElement('div');
  const b = document.createElement('b'); b.style.color = m.color; b.textContent = m.name + ': ';
  d.appendChild(b); d.appendChild(document.createTextNode(m.text));
  appendMsg(d);
}
function sysMsg(text) { const d = document.createElement('div'); d.className = 'sys'; d.textContent = text; appendMsg(d); }
function appendMsg(d) { $('messages').appendChild(d); $('messages').scrollTop = 1e9; }

function toast(text) { const t = $('toast'); t.textContent = text; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 2000); }

window.addEventListener('pagehide', () => { if (inRoom) send({ t: 'bye' }); });

// phones freeze background tabs: when the user comes back, reconnect and catch up on the drawing
let hiddenAt = 0;
const reconnectAll = () => clients.forEach(c => { try { if (!c.connected && !c.reconnecting) c.reconnect(); } catch {} });
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { hiddenAt = Date.now(); return; }
  if (!inRoom) return;
  reconnectAll();
  if (Date.now() - hiddenAt > 4000) { sendPing(); requestState(true); }
});
window.addEventListener('online', () => { reconnectAll(); updateStatus(); });
window.addEventListener('offline', updateStatus);
</script>
